name: release

# Runs when a version tag is pushed (git tag v0.1.0 && git push origin v0.1.0).
# Publishes the two images and the chart to ghcr.io under the repository
# owner's account, signs the images, and pins the published chart to the
# image digests.
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  AGENT_IMAGE: ghcr.io/naved124/tephrad
  COLLECTOR_IMAGE: ghcr.io/naved124/tephra-collector
  CHART_REPO: oci://ghcr.io/naved124/charts

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      # For keyless signing: the signature is bound to this workflow's
      # identity, and no signing key is stored anywhere.
      id-token: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Version from the tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          chart="$(awk '$1 == "appVersion:" {gsub(/"/, "", $2); print $2}' deploy/helm/tephra/Chart.yaml)"
          if [ "$version" != "$chart" ]; then
            echo "tag $GITHUB_REF_NAME does not match the chart appVersion $chart" >&2
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - name: Install cosign
        run: |
          curl -fsSL -o cosign https://github.com/sigstore/cosign/releases/download/v3.1.4/cosign-linux-amd64
          echo "424e2c97d0b45fd7a6b608a87f090f35633f4c23ece5f092d48bba11aaf4bbfa  cosign" | sha256sum -c -
          sudo install -m 0755 cosign /usr/local/bin/cosign
      - name: Install helm
        run: |
          curl -fsSL -o helm.tgz https://get.helm.sh/helm-v4.3.1-linux-amd64.tar.gz
          echo "0403a88ae20913d11b10a2467b50087721fea7581736da6b9d3992f5357fe54b  helm.tgz" | sha256sum -c -
          tar -xzf helm.tgz linux-amd64/helm
          sudo install -m 0755 linux-amd64/helm /usr/local/bin/helm
      - name: Log in to the registry
        env:
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
          printf '%s' "$TOKEN" | helm registry login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
      - name: Build and push the images
        run: |
          docker build -f deploy/docker/tephrad.Dockerfile --build-arg "VERSION=$VERSION" -t "$AGENT_IMAGE:$VERSION" .
          docker build -f deploy/docker/collector.Dockerfile --build-arg "VERSION=$VERSION" -t "$COLLECTOR_IMAGE:$VERSION" .
          docker push "$AGENT_IMAGE:$VERSION"
          docker push "$COLLECTOR_IMAGE:$VERSION"
          # The digest the registry stored, which is what gets signed and
          # what the chart will name.
          digest() { docker image inspect -f '{{index .RepoDigests 0}}' "$1" | sed 's/.*@//'; }
          echo "AGENT_DIGEST=$(digest "$AGENT_IMAGE:$VERSION")" >> "$GITHUB_ENV"
          echo "COLLECTOR_DIGEST=$(digest "$COLLECTOR_IMAGE:$VERSION")" >> "$GITHUB_ENV"
      - name: Sign the images
        run: |
          cosign sign --yes "$AGENT_IMAGE@$AGENT_DIGEST"
          cosign sign --yes "$COLLECTOR_IMAGE@$COLLECTOR_DIGEST"
      - name: Package the chart with the digests and push it
        run: |
          yq -i ".image.digest = \"$AGENT_DIGEST\" | .collector.image.digest = \"$COLLECTOR_DIGEST\"" deploy/helm/tephra/values.yaml
          helm lint deploy/helm/tephra
          helm package deploy/helm/tephra --version "$VERSION" --app-version "$VERSION" -d dist
          helm push "dist/tephra-$VERSION.tgz" "$CHART_REPO"
      - name: Summary
        run: |
          {
            echo "### Published"
            echo "- \`$AGENT_IMAGE@$AGENT_DIGEST\`"
            echo "- \`$COLLECTOR_IMAGE@$COLLECTOR_DIGEST\`"
            echo "- chart \`$CHART_REPO/tephra:$VERSION\`"
            echo
            echo "Verify a signature with:"
            echo "\`cosign verify $AGENT_IMAGE@$AGENT_DIGEST --certificate-identity-regexp 'https://github.com/${GITHUB_REPOSITORY}/' --certificate-oidc-issuer https://token.actions.githubusercontent.com\`"
          } >> "$GITHUB_STEP_SUMMARY"
