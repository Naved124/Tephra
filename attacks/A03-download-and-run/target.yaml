# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: Service
metadata:
  name: files
spec:
  clusterIP: None
  selector:
    app: files
  ports:
    - port: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: files
  labels:
    app: files
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: files
      image: busybox:1.37
      command: ["/bin/sh", "-c"]
      args:
        - |
          mkdir -p /www && printf '#!/bin/sh\necho tool ran\n' > /www/tool && exec httpd -f -p 8080 -h /www
      securityContext:
        runAsUser: 0
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: victim
  labels:
    app: victim
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: victim
      image: busybox:1.37
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do sleep 3600; done
      securityContext:
        runAsUser: 0
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
