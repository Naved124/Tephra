# SPDX-License-Identifier: Apache-2.0
#
# Ordinary workloads for the false-positive run: a web server under HTTP
# load, a database under a benchmark, an image build every few minutes, a
# notebook server that starts kernels and terminals, and a worker pool run
# by an entrypoint script. The harness adds rolling updates of the web
# server.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
spec:
  replicas: 2
  selector:
    matchLabels: {app: web}
  template:
    metadata:
      labels: {app: web}
    spec:
      containers:
        - name: nginx
          image: nginx:1.27-alpine
          ports: [{containerPort: 80}]
          readinessProbe:
            httpGet: {path: /, port: 80}
---
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  selector: {app: web}
  ports: [{port: 80}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: load
spec:
  replicas: 1
  selector:
    matchLabels: {app: load}
  template:
    metadata:
      labels: {app: load}
    spec:
      containers:
        - name: load
          image: python:3.14-alpine
          command: ["python3", "-u", "-c"]
          args:
            - |
              import time, urllib.request
              n = 0
              while True:
                  try:
                      urllib.request.urlopen("http://web/", timeout=5).read()
                      n += 1
                  except Exception as e:
                      print("request failed:", e)
                      time.sleep(1)
                  if n % 1000 == 0:
                      print(n, "requests")
                  time.sleep(0.02)
---
apiVersion: v1
kind: Service
metadata:
  name: db
spec:
  clusterIP: None
  selector: {app: db}
  ports: [{port: 5432}]
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: db
spec:
  serviceName: db
  replicas: 1
  selector:
    matchLabels: {app: db}
  template:
    metadata:
      labels: {app: db}
    spec:
      containers:
        - name: postgres
          image: postgres:17-alpine
          env:
            # A throwaway database in a throwaway namespace.
            - {name: POSTGRES_PASSWORD, value: lab-only}
          ports: [{containerPort: 5432}]
          readinessProbe:
            exec: {command: ["pg_isready", "-U", "postgres"]}
            periodSeconds: 3
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: bench
spec:
  replicas: 1
  selector:
    matchLabels: {app: bench}
  template:
    metadata:
      labels: {app: bench}
    spec:
      containers:
        - name: pgbench
          image: postgres:17-alpine
          env:
            - {name: PGPASSWORD, value: lab-only}
            - {name: PGHOST, value: db}
            - {name: PGUSER, value: postgres}
          command: ["/bin/sh", "-c"]
          args:
            - |
              until pg_isready -q; do sleep 2; done
              pgbench -i -s 5 postgres
              while true; do pgbench -c 4 -T 120 postgres; done
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: build-context
data:
  Dockerfile: |
    FROM busybox:1.37
    RUN mkdir -p /app && echo 'echo hello' > /app/run.sh && chmod +x /app/run.sh
    RUN for i in 1 2 3 4 5; do echo "$i" >> /app/data; done
    CMD ["/app/run.sh"]
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: build
spec:
  schedule: "*/5 * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      backoffLimit: 0
      ttlSecondsAfterFinished: 120
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: kaniko
              image: gcr.io/kaniko-project/executor:v1.23.2
              args: ["--dockerfile=/workspace/Dockerfile", "--context=dir:///workspace", "--no-push"]
              volumeMounts:
                - {name: context, mountPath: /workspace}
          volumes:
            - name: context
              configMap: {name: build-context}
---
# Behaves like a Jupyter server: the application is a Python process that
# starts kernels (its own interpreter again, talking to it over loopback)
# and terminals (a shell on a pseudo-terminal). R028 and R029 must leave all
# of it alone: everything comes from the container's application.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notebook
spec:
  replicas: 1
  selector:
    matchLabels: {app: notebook}
  template:
    metadata:
      labels: {app: notebook}
    spec:
      containers:
        - name: notebook
          image: python:3.14-alpine
          command: ["python3", "-u", "-c"]
          args:
            - |
              import os, pty, socket, subprocess, sys, threading, time
              srv = socket.socket(); srv.bind(("127.0.0.1", 8888)); srv.listen(8)
              def serve():
                  while True:
                      c, _ = srv.accept(); c.recv(64); c.sendall(b"ok"); c.close()
              threading.Thread(target=serve, daemon=True).start()
              kernel = "import socket; s = socket.create_connection(('127.0.0.1', 8888)); s.sendall(b'execute'); print(s.recv(64))"
              n = 0
              while True:
                  subprocess.run([sys.executable, "-c", kernel], check=False)
                  pid, fd = pty.fork()
                  if pid == 0:
                      os.execv("/bin/sh", ["sh", "-c", "ls / > /dev/null; exit"])
                  try:
                      while os.read(fd, 1024):
                          pass
                  except OSError:
                      pass
                  os.waitpid(pid, 0)
                  n += 1
                  if n % 20 == 0:
                      print(n, "kernels and terminals")
                  time.sleep(15)
---
# A worker pool as many images run one: the entrypoint is a shell loop that
# starts a Python worker, which fetches work over the network. R028 must
# leave it alone: the worker's parent is the container's first process.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
spec:
  replicas: 1
  selector:
    matchLabels: {app: worker}
  template:
    metadata:
      labels: {app: worker}
    spec:
      containers:
        - name: worker
          image: python:3.14-alpine
          command: ["/bin/sh", "-c"]
          args:
            - |
              while true; do
                python3 -c 'import urllib.request; urllib.request.urlopen("http://web/", timeout=5).read()' || echo "fetch failed"
                sleep 10
              done
