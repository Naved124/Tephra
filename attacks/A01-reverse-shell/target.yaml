# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: Service
metadata:
  name: web
spec:
  clusterIP: None
  selector:
    app: web
  ports:
    - port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: listener
spec:
  clusterIP: None
  selector:
    app: listener
  ports:
    - port: 9001
---
apiVersion: v1
kind: Pod
metadata:
  name: web
  labels:
    app: web
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: web
      image: busybox:1.37
      command: ["/bin/sh", "-c"]
      args:
        - |
          mkdir -p /www/cgi-bin
          cat > /www/cgi-bin/run <<'CGI'
          #!/bin/sh
          # A deliberately vulnerable endpoint: it runs its query string.
          echo "Content-Type: text/plain"
          echo
          sh -c "$(echo "$QUERY_STRING" | sed 's/%20/ /g')" 2>&1
          CGI
          chmod +x /www/cgi-bin/run
          exec httpd -f -p 8080 -h /www
      securityContext:
        runAsUser: 0
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: listener
  labels:
    app: listener
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: listener
      image: busybox:1.37
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do sleep 3600; done
      securityContext:
        runAsUser: 0
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
