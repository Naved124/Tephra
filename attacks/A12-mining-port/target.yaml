# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: Service
metadata:
  name: pool
spec:
  clusterIP: None
  selector:
    app: pool
  ports:
    - port: 3333
---
apiVersion: v1
kind: Pod
metadata:
  name: pool
  labels:
    app: pool
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: pool
      image: busybox:1.37
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do nc -l -p 3333 </dev/null >/dev/null 2>&1; done
      securityContext:
        runAsUser: 0
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: victim
  labels:
    app: victim
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: victim
      image: busybox:1.37
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do sleep 3600; done
      securityContext:
        runAsUser: 0
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
