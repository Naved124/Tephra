apiVersion: v1
kind: Pod
metadata:
  name: victim
  labels:
    app: victim
spec:
  terminationGracePeriodSeconds: 1
  hostPID: true
  containers:
    - name: victim
      image: busybox:1.37
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do sleep 3600; done
      securityContext:
        runAsUser: 0
        privileged: true
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: flooder
  labels:
    app: flooder
spec:
  terminationGracePeriodSeconds: 1
  # On the victim's node, so that its alerts go through the same agent.
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels: {app: victim}
          topologyKey: kubernetes.io/hostname
  containers:
    - name: flooder
      image: busybox:1.37
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do cat /etc/shadow >/dev/null; done
      securityContext:
        runAsUser: 0
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
