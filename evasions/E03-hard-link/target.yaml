apiVersion: v1
kind: Pod
metadata:
  name: victim
  labels:
    app: victim
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: victim
      image: busybox:1.37
      command: ["/bin/sh", "-c"]
      args:
        - |
          # The link is made at start-up, before the scenario's window,
          # so that only the read through it is judged.
          ln /etc/shadow /tmp/notes.txt
          while true; do sleep 3600; done
      securityContext:
        runAsUser: 0
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
