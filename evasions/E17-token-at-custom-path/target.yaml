apiVersion: v1
kind: Pod
metadata:
  name: victim
  labels:
    app: victim
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: victim
      image: python:3.14-slim
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do sleep 3600; done
      securityContext:
        runAsUser: 0
      volumeMounts:
        - {name: app-token, mountPath: /var/run/app, readOnly: true}
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
  volumes:
    - name: app-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
