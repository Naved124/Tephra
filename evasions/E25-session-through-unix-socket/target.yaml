apiVersion: v1
kind: Service
metadata:
  name: listener
spec:
  clusterIP: None
  selector:
    app: listener
  ports:
    - port: 4444
---
apiVersion: v1
kind: Pod
metadata:
  name: listener
  labels:
    app: listener
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: listener
      image: python:3.14-slim
      command: ["python3", "-u", "-c"]
      args:
        - |
          import socket
          srv = socket.socket(); srv.setsockopt(socket.SOL_SOCKET, socket.SO_REUSEADDR, 1)
          srv.bind(("0.0.0.0", 4444)); srv.listen(4)
          while True:
              c, _ = srv.accept(); c.settimeout(30)
              try:
                  for cmd in (b"ls /\n", b"cat /etc/hostname\n", b"exit\n"):
                      c.sendall(cmd)
                      if cmd != b"exit\n":
                          print("session said:", c.recv(4096))
              except OSError as e:
                  print("session ended:", e)
              c.close()
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: victim
  labels:
    app: victim
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: app
      image: perl:5.40-slim
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do sleep 3600; done
      volumeMounts:
        - {name: shared, mountPath: /shared}
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
    # Stands in for a proxy sidecar: its own program forwards a Unix socket
    # in a shared volume to another pod.
    - name: proxy
      image: python:3.14-slim
      command: ["python3", "-u", "-c"]
      args:
        - |
          import socket, threading
          def pipe(a, b):
              try:
                  while True:
                      d = a.recv(4096)
                      if not d:
                          break
                      b.sendall(d)
              except OSError:
                  pass
              for s in (a, b):
                  try:
                      s.shutdown(socket.SHUT_RDWR)
                  except OSError:
                      pass
          srv = socket.socket(socket.AF_UNIX)
          srv.bind("/shared/proxy.sock"); srv.listen(4)
          while True:
              c, _ = srv.accept()
              u = socket.create_connection(("listener", 4444))
              threading.Thread(target=pipe, args=(c, u), daemon=True).start()
              threading.Thread(target=pipe, args=(u, c), daemon=True).start()
      volumeMounts:
        - {name: shared, mountPath: /shared}
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
  volumes:
    - name: shared
      emptyDir: {}
