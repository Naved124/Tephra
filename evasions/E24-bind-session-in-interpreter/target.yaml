# SPDX-License-Identifier: Apache-2.0
apiVersion: v1
kind: Service
metadata:
  name: victim
spec:
  clusterIP: None
  selector:
    app: victim
  ports:
    - port: 9002
---
apiVersion: v1
kind: Pod
metadata:
  name: victim
  labels:
    app: victim
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: victim
      image: python:3.14-slim
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do sleep 3600; done
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: operator
  labels:
    app: operator
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: operator
      image: python:3.14-slim
      command: ["python3", "-u", "-c"]
      args:
        - |
          import socket, time
          while True:
              try:
                  c = socket.create_connection(("victim", 9002), timeout=2)
              except OSError:
                  time.sleep(1)
                  continue
              c.settimeout(30)
              try:
                  for cmd in (b"ls /\n", b"cat /etc/hostname\n", b"exit\n"):
                      c.sendall(cmd)
                      if cmd != b"exit\n":
                          print("session said:", c.recv(4096))
              except OSError as e:
                  print("session ended:", e)
              c.close()
              time.sleep(5)
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
