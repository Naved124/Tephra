apiVersion: v1
kind: Pod
metadata:
  name: victim
  labels:
    app: victim
spec:
  terminationGracePeriodSeconds: 1
  shareProcessNamespace: true
  containers:
    - name: app
      image: python:3.14-slim
      command: ["python3", "-m", "http.server", "8080"]
      securityContext:
        runAsUser: 0
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
    - name: helper
      image: python:3.14-slim
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do sleep 3600; done
      securityContext:
        runAsUser: 0
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
