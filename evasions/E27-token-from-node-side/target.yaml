apiVersion: v1
kind: Pod
metadata:
  name: victim
  labels:
    app: victim
spec:
  terminationGracePeriodSeconds: 1
  containers:
    - name: victim
      image: busybox:1.37
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do sleep 3600; done
      securityContext:
        runAsUser: 0
      volumeMounts:
        - {name: kubelet, mountPath: /hostkubelet, readOnly: true}
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
  volumes:
    - name: kubelet
      hostPath: {path: /var/lib/kubelet, type: Directory}
---
apiVersion: v1
kind: Pod
metadata:
  name: app
  labels:
    app: app
spec:
  terminationGracePeriodSeconds: 1
  automountServiceAccountToken: false
  affinity:
    podAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels: {app: victim}
          topologyKey: kubernetes.io/hostname
  containers:
    - name: app
      image: busybox:1.37
      command: ["/bin/sh", "-c"]
      args:
        - |
          while true; do sleep 3600; done
      volumeMounts:
        - {name: e27-token, mountPath: /var/run/app, readOnly: true}
      resources:
        requests:
          cpu: 10m
          memory: 16Mi
  volumes:
    - name: e27-token
      projected:
        sources:
          - serviceAccountToken:
              path: token
              expirationSeconds: 3600
