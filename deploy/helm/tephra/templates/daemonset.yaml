apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: {{ .Release.Name }}-agent
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "tephra.labels" . | nindent 4 }}
    app.kubernetes.io/component: agent
spec:
  selector:
    matchLabels:
      {{- include "tephra.agent.selectorLabels" . | nindent 6 }}
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
  template:
    metadata:
      labels:
        {{- include "tephra.agent.selectorLabels" . | nindent 8 }}
      annotations:
        # A changed configuration or rule set rolls the agents. Edited in
        # place, the ConfigMaps are picked up on SIGHUP instead.
        checksum/config: {{ include (print $.Template.BasePath "/agent-config.yaml") . | sha256sum }}
        {{- with .Values.agent.podAnnotations }}
        {{- toYaml . | nindent 8 }}
        {{- end }}
    spec:
      serviceAccountName: {{ .Release.Name }}-agent
      hostPID: true
      terminationGracePeriodSeconds: 10
      # The sensor must run on every node, control-plane nodes included.
      tolerations:
        - operator: Exists
      containers:
        - name: tephrad
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - --config=/etc/tephra/config.yaml
          ports:
            - name: metrics
              containerPort: {{ .Values.agent.metricsPort }}
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: POD_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
          securityContext:
            {{- if .Values.agent.privileged }}
            privileged: true
            {{- else }}
            privileged: false
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add:
                {{- toYaml .Values.agent.capabilities | nindent 16 }}
            {{- end }}
          resources:
            {{- toYaml .Values.agent.resources | nindent 12 }}
          volumeMounts:
            - name: config
              mountPath: /etc/tephra/config.yaml
              subPath: config.yaml
              readOnly: true
            - name: rules
              mountPath: /etc/tephra/rules
              readOnly: true
            - name: btf
              mountPath: /sys/kernel/btf
              readOnly: true
            - name: cgroup
              mountPath: /sys/fs/cgroup
              readOnly: true
            - name: security
              mountPath: /sys/kernel/security
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: {{ .Release.Name }}-agent-config
        - name: rules
          configMap:
            name: {{ .Release.Name }}-rules
        - name: btf
          hostPath:
            path: /sys/kernel/btf
            type: Directory
        - name: cgroup
          hostPath:
            path: /sys/fs/cgroup
            type: Directory
        - name: security
          hostPath:
            path: /sys/kernel/security
            type: Directory
