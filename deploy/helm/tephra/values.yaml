# Value of the cluster label on everything stored in Loki.
cluster: default

image:
  repository: ghcr.io/tephrasec/tephrad
  # Defaults to the chart appVersion.
  tag: ""
  # sha256:... of the image. When set it is used instead of the tag, so the
  # node runs exactly the image that was signed. The released chart has it
  # filled in.
  digest: ""
  pullPolicy: IfNotPresent

agent:
  # false installs the backend without agents (used by the benchmarks to
  # measure a node with no sensor).
  enabled: true
  # The agent runs with these capabilities and nothing else. Set privileged
  # to true only on a kernel or runtime where the list is not enough; the
  # agent's start-up log says which hook failed.
  privileged: false
  capabilities:
    - BPF
    - PERFMON
    - SYS_RESOURCE
    - SYS_PTRACE
  # Events ring buffer in bytes; a power of two.
  ringBufSize: 16777216
  # Prometheus endpoint, /metrics on the pod IP.
  metricsPort: 9090
  # Export every event, not only alerts. An investigation needs what happened
  # around an alert, and a rule written later can be run over past events.
  rawEvents: true
  # Records buffered for the collector. When it is full raw events are dropped
  # before alerts, and both are counted.
  exportQueue: 8192
  # Event types to capture. Empty means every type while rawEvents is on, and
  # only what the rules need when it is off.
  events: []
  # Destinations whose connections are dropped in the kernel.
  # Empty by default, loopback included: a session relayed through a local
  # proxy, or reached through kubectl port-forward, arrives on loopback.
  netIgnore: []
  # Export raw events of loopback connections too. Off: they are judged by
  # the rules and leave the agent only as alerts.
  loopbackEvents: false
  # Connection cost. Both off by default; turning both on is recommended
  # for any node with busy network pods (README, "Connection cost"):
  # measured on 5.15, throughput -19.9% -> -3.7%, agent CPU 77% -> 1% of a
  # core, and no missed detection or new alert in the lab's runs.
  #
  # quietConnections: the kernel skips the connections of processes no
  # loaded rule can fire on (a web server, a client that is not an
  # interpreter). Connects to a port a rule names and to the Kubernetes API
  # are always reported. With rawEvents on, the skipped connections are
  # counted and exported every 10 s as connection_summary records (one per
  # process and destination, with count and first/last time); what is not
  # kept is each connection's own time and the client's port.
  quietConnections: false
  # ringWakeup: batch the kernel's wake-ups of the agent: wake it once this
  # many bytes wait (65536 recommended), and read every interval otherwise.
  # Alerts can arrive up to interval later. 0 wakes it per record.
  ringWakeup:
    bytes: 0
    interval: 10ms
  # File watches in addition to the ones the rules ask for, for example
  #   - {path: /etc/kubernetes/, kind: prefix, ops: [write]}
  watch: []
  # Extra addresses of the Kubernetes API, as host:port. The service address
  # every pod is given is always included.
  k8sApi: []
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      memory: 512Mi
  podAnnotations: {}
  # Refusal in the kernel by rules with "action: block". Needs a kernel with
  # BPF LSM active ("bpf" in /sys/kernel/security/lsm); elsewhere the agent
  # logs that it is unavailable and only detects.
  enforcement:
    # Load the enforcement programs at all. Off by default.
    enabled: false
    # Report what would be refused and refuse nothing. Set to false only
    # after a dry run has shown no would-deny events on normal workloads.
    dryRun: true
    # pinned: refusals stay in force while the agent restarts, held by the
    # kernel under pinDir (mounted from the node). detach: they end with the
    # agent. "tephrad enforce off" in the agent pod, or bpftool on the node,
    # turns pinned refusals off.
    onAgentExit: pinned
    # Only pods with this label set to "true" are refused anything.
    label: tephrasec.tech/enforce
    # Pods in these namespaces never are, label or not. The agent's own
    # namespace is always added.
    protectNamespaces:
      - kube-system
    pinDir: /sys/fs/bpf/tephra
    # Capabilities added to agent.capabilities while enforcement is enabled.
    extraCapabilities: []
  # While the kernel's ring buffer is at least half full, the opens of one
  # watched file by one program in one pod are sent once per window and
  # counted in between, so a flood of them cannot push other records out.
  # Counts come as file_summary records with the file and program; opens of
  # which no record got through come as file_open records with a count and
  # go through the rules. "0s" turns it off.
  fileSummaryWindow: 10s
  tamper:
    # Keep the kernel recording when the agent is killed, crashes or is
    # frozen: the programs and the ring buffer are pinned under pinDir and
    # the next agent reads what was recorded meanwhile. A stop by Kubernetes
    # (rollout, upgrade, uninstall, drain) removes the pins, so nothing is
    # left behind. "tephrad detect off" in the agent pod removes them by hand.
    keepRecording: true
    pinDir: /sys/fs/bpf/tephra/detect
  # Blind mode: while the agent is gone, stopped or wedged, the kernel refuses
  # a short list of actions to processes in pods, label or not. These are what
  # ordinary pods never do and an attacker does after blinding the sensor:
  # running a deleted or in-memory binary, ptrace, loading a module, mount,
  # reading /etc/shadow, and writing ld.so.preload, authorized_keys,
  # release_agent or core_pattern. Each refusal raises R038 once an agent is
  # back. Pods in enforcement.protectNamespaces are left alone. Needs BPF
  # LSM and tamper.keepRecording; a stop by Kubernetes switches it off first.
  blind:
    # on, dry_run (report, refuse nothing) or off.
    mode: "on"
    # How old the agent's heartbeat (every second) may get before the
    # sensor counts as blind. A kill or stop signal to the agent, or its
    # exit, counts at once.
    staleAfter: 12s
    # Leave empty for the defaults above. Actions: exec_unlinked, ptrace,
    # module_load, mount. Files: {path, kind: exact|name, ops: [read, write]}.
    actions: []
    files: []

# Receives the agents' gRPC streams and pushes them to Loki.
collector:
  enabled: true
  image:
    repository: ghcr.io/tephrasec/tephra-collector
    tag: ""
    digest: ""
    pullPolicy: IfNotPresent
  # Loki to push to. Empty means the Loki installed by this chart.
  lokiUrl: ""
  # Bytes of records held in memory before streams are refused.
  maxBytes: 67108864
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      memory: 256Mi
  podAnnotations: {}

# A single-binary Loki on local storage: enough for a lab or a demo, not a
# production log store. Disable it and set collector.lokiUrl to use your own.
loki:
  enabled: true
  image: grafana/loki:3.6.18
  # Alerts are kept longer than raw events.
  retention:
    alerts: 720h
    events: 72h
  # Without persistence the data is lost when the pod is.
  persistence:
    enabled: false
    size: 10Gi
    storageClassName: ""
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      memory: 1Gi

grafana:
  enabled: true
  image: grafana/grafana:12.3.1
  # The admin password is generated once and kept in the Secret
  # <release>-grafana. Anonymous access is off.
  adminUser: admin
  # Webhook that the "high or critical alert" rule posts to. Empty leaves the
  # rule in place with no notification.
  alertWebhookUrl: ""
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 512Mi

# Only agents may reach the collector, and only the collector and Grafana may
# reach Loki. Needs a CNI that enforces NetworkPolicy.
networkPolicy:
  enabled: true
