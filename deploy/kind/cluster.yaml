# Lab cluster: one control-plane node and two workers on containerd, dual-stack
# so IPv4 and IPv6 paths are both exercised.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: tephra
networking:
  ipFamily: dual
nodes:
  # tephra.dev/lab marks the cluster as a lab. The attack harness refuses to
  # run against a cluster without it.
  - role: control-plane
    labels:
      tephra.dev/lab: "true"
  - role: worker
    labels:
      tephra.dev/lab: "true"
  - role: worker
    labels:
      tephra.dev/lab: "true"
