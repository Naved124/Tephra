// The agent-to-collector API. Record carries the same fields as the JSON
// line the agent writes on stdout (section 5 of the design); field comments
// there apply here.
syntax = "proto3";

package tephra.v1;

option go_package = "github.com/Naved124/tephra/api/tephra/v1;tephrav1";

service Exporter {
  // Export sends a batch of records as one stream. The collector answers
  // once the whole batch is stored. An error means none of it may be
  // assumed stored, and the agent sends the batch again.
  rpc Export(stream Record) returns (Ack);
}

message Ack {
  // Records stored.
  uint64 accepted = 1;
  // Records refused for good: malformed, or turned down by the store.
  // Sending them again would not help.
  uint64 rejected = 2;
}

// Record is one enriched event, or an alert when rule is set.
message Record {
  string ts = 1;
  string type = 2;
  string node = 3;
  Rule rule = 4;
  Process process = 5;
  Parent parent = 6;
  repeated string ancestors = 7;
  Container container = 8;
  K8s k8s = 9;
  Exit exit = 10;
  Network network = 11;
  File file = 12;
  // Set on records of type "health" only: the sender's own counters, sent
  // on a timer so that the dashboard can show sensor health from the same
  // store as the events.
  map<string, uint64> health = 13;
  Ptrace ptrace = 14;
  Memfd memfd = 15;
  Module module = 16;
  Bpf bpf = 17;
  Cred cred = 18;
  Mount mount = 19;
  Namespaces namespaces = 20;
  Enforce enforce = 21;
  Signal signal = 22;
  Repeats repeats = 23;
}

// The summary of a group of repeated alerts: how many more of the same kind
// came after the first, which was sent on its own.
message Repeats {
  uint64 count = 1;
  string first = 2;
  string last = 3;
  bool folded = 4;
  repeated string samples = 5;
}

// An action the kernel refused (denied), or in dry-run mode would have.
message Enforce {
  string action = 1;
  bool denied = 2;
}

// A signal sent to the agent; the sender is the record's process.
message Signal {
  uint32 number = 1;
  string name = 2;
  uint32 target_pid = 3;
}

message Ptrace {
  uint32 target_pid = 1;
  string target_image = 2;
  string target_command_line = 3;
  uint32 mode = 4;
  bool target_is_agent = 5;
}

message Memfd {
  uint32 flags = 1;
}

message Module {
  string name = 1;
}

message Bpf {
  uint32 prog_type = 1;
  string name = 2;
}

message Cred {
  uint32 old_uid = 1;
  uint32 new_uid = 2;
  uint32 old_euid = 3;
  uint32 new_euid = 4;
  uint32 old_gid = 5;
  uint32 new_gid = 6;
  bool in_exec = 7;
  bool caps_gained = 8;
  uint64 old_cap_effective = 9;
  uint64 new_cap_effective = 10;
}

message Mount {
  string fstype = 1;
  uint64 flags = 2;
  string target = 3;
}

message Namespaces {
  repeated string changed = 1;
  repeated string host = 2;
  repeated string other_pod = 3;
}

message Rule {
  string id = 1;
  string title = 2;
  string level = 3;
  repeated string tags = 4;
}

message Process {
  uint32 pid = 1;
  uint64 start_time_ns = 2;
  string image = 3;
  string command_line = 4;
  string user = 5;
  uint32 uid = 6;
  uint32 gid = 7;
  uint64 cgroup_id = 8;
  bool is_main_binary = 9;
  // Set on exec events only.
  Exec exec = 10;
  // The process runs one of the node's container runtime binaries.
  bool runtime = 11;
  // The tree of processes this one belongs to: "<pid>.<start time>" of
  // its topmost ancestor in the same cgroup.
  string tree = 12;
  // What the binary is by its content: shell, interpreter, download_tool.
  string identity = 13;
  // The binary changed after its container started.
  bool exe_modified = 14;
  // In one container's cgroup but came from another.
  bool identity_mismatch = 15;
  // In the agent's own container and not the agent.
  bool in_agent_container = 16;
}

message Exec {
  bool stdin_is_socket = 1;
  bool stdout_is_socket = 2;
  bool unlinked = 3;
  bool setuid = 4;
  bool argv_truncated = 5;
  uint64 inode = 6;
  uint32 dev = 7;
  uint64 cap_effective = 8;
  map<string, string> env = 9;
  bool env_truncated = 10;
  // When the executable's inode last changed, nanoseconds since the epoch.
  uint64 exe_ctime_ns = 11;
  // stdin and stdout are pseudo-terminals.
  bool stdin_is_pty = 12;
  bool stdout_is_pty = 13;
}

message Parent {
  uint32 pid = 1;
  string image = 2;
  string command_line = 3;
  bool runtime = 4;
  // Only for a parent in the same container.
  string identity = 5;
  bool is_main_binary = 6;
  bool container_first = 7;
}

message Container {
  string id = 1;
  string name = 2;
  string image = 3;
}

message K8s {
  string namespace = 1;
  string pod = 2;
  map<string, string> labels = 3;
}

message Exit {
  uint32 code = 1;
  uint32 signal = 2;
}

message Network {
  string direction = 1;
  string family = 2;
  string protocol = 3;
  string source_ip = 4;
  uint32 source_port = 5;
  string destination_ip = 6;
  uint32 destination_port = 7;
  string unix_path = 8;
  bool is_k8s_api = 9;
}

message File {
  string path = 1;
  string target = 2;
  uint32 flags = 3;
  bool write = 4;
  bool truncate = 5;
  uint64 inode = 6;
  uint32 dev = 7;
  string matched_by = 8;
  // Set on file_change: unlink, rename_from, rename_to, link, symlink,
  // truncate.
  string op = 9;
  // Set on file_denied: EACCES, EPERM or EROFS.
  string error = 10;
  // Set when the file is a Kubernetes credential: sa_token.
  string k8s_credential = 11;
  // The pod the credential belongs to, namespace/name.
  string credential_pod = 12;
  // The credential belongs to another pod than the one that opened it.
  bool credential_other_pod = 13;
}
