id: R006
title: Service account token read by a process other than the pod's main binary
level: medium
tags: [attack.credential_access, attack.t1528]
event: file_open
detection:
  # The token by what it is: the agent learns from each pod spec which file
  # is its token, and watches it whatever path is used to reach it.
  credential:
    file.k8s_credential: sa_token
  other_pod:
    file.credential_other_pod: true
  # The token by its standard path, before the agent has resolved it.
  selection:
    file.path|startswith:
      - /var/run/secrets/kubernetes.io/serviceaccount/
      - /run/secrets/kubernetes.io/serviceaccount/
  token:
    file.path|endswith: /token
  main:
    process.is_main_binary: true
  runtime:
    process.runtime: true
  condition: (credential and not runtime and not (main and not other_pod)) or (selection and token and not main)
action: alert
description: >-
  The workload itself reads its token to talk to the API. Any other process
  reading it, such as a shell, cat or dd, is collecting a credential. The
  token is known from the pod spec, not by its path: a token projected at a
  custom path or under another name (E17, E22), reached through
  /proc/<pid>/root, or read from the node's side of the volume under
  /var/lib/kubelet (E27) is the same file. A pod's main binary reading
  another pod's token is not left out. The kubelet, which writes and checks
  the tokens, is.
falsepositives:
  - Sidecar-style helper processes started by the main binary that use the API themselves
  - Node agents that read other pods' volumes from the kubelet's directory
