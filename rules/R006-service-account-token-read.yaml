id: R006
title: Service account token read by a process other than the pod's main binary
level: medium
tags: [attack.credential_access, attack.t1528]
event: file_open
detection:
  selection:
    file.path|startswith:
      - /var/run/secrets/kubernetes.io/serviceaccount/
      - /run/secrets/kubernetes.io/serviceaccount/
  token:
    file.path|endswith: /token
  main:
    process.is_main_binary: true
  condition: selection and token and not main
action: alert
description: >-
  The workload itself reads its token to talk to the API. Any other process
  in the pod reading it, such as a shell or cat, is collecting a credential.
falsepositives:
  - Sidecar-style helper processes started by the main binary that use the API themselves
