id: R010
title: Connection to the container runtime's Unix socket from inside a container
level: critical
tags: [attack.privilege_escalation, attack.t1611]
event: connect
detection:
  selection:
    network.family: unix
    network.unix_path|endswith:
      - /containerd.sock
      - /docker.sock
      - /crio.sock
      - /cri-dockerd.sock
      - /dockershim.sock
      - /podman.sock
  host:
    k8s.namespace: host
  condition: selection and not host
action: alert
description: >-
  Whoever can talk to the runtime socket can start a privileged container
  with the node's filesystem mounted, which is full control of the node.
falsepositives:
  - Monitoring and CI agents that are deliberately given the runtime socket
