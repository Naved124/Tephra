id: R003
title: Execution of a memfd or already-unlinked binary
level: high
tags: [attack.defense_evasion, attack.t1620]
event: exec
detection:
  unlinked:
    process.unlinked: true
  memfd:
    process.Image|startswith: ["/memfd:", /proc/self/fd/, /dev/fd/]
  runtime:
    process.CommandLine: runc init
    parent.Image:
      - /usr/bin/runc
      - /usr/sbin/runc
      - /usr/local/bin/runc
      - /usr/local/sbin/runc
  condition: (unlinked or memfd) and not runtime
action: alert
description: >-
  The binary has no name on disk: it was run from an anonymous memory file or
  deleted before it was executed. Both leave nothing for a file scanner to
  find.
falsepositives:
  - Container runtimes that re-execute themselves through a file descriptor. runc does so for every container start and every exec into a container; the filter covers it by its exact command line and its parent's path. A process that imitates both is not reported by this rule
  - Self-updating programs that replace and delete their own binary
