id: R003
title: Execution of a memfd or already-unlinked binary
level: high
tags: [attack.defense_evasion, attack.t1620]
event: exec
detection:
  unlinked:
    process.unlinked: true
  memfd:
    process.Image|startswith: ["/memfd:", /proc/self/fd/, /dev/fd/]
  runtime:
    process.runtime: true
  condition: (unlinked or memfd) and not runtime
action: alert
description: >-
  The binary has no name on disk: it was run from an anonymous memory file or
  deleted before it was executed. Both leave nothing for a file scanner to
  find.
falsepositives:
  - Container runtimes that re-execute themselves through a file descriptor. runc does so for every container start and every exec into a container. It is recognised by the identity of the node's runc binary (runtime_binaries in the agent configuration), not by a name or a command line, so a process in a container cannot pass for it
  - Self-updating programs that replace and delete their own binary
